<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Is everything here really free?","acceptedAnswer":{"@type":"Answer","text":"Yes, and it stays free. I built The Unit Navigator over 3 years at Monash because nobody handed me one. If a 1-on-1 or a live cohort isn't possible for you right now, you are not locked out. The same system I run is free in 4 places: The Unit Navigator, my Tuesday newsletter on Substack, my socials (e.g., YouTube, Instagram), and the Library (top menu, under Free), with my Dictionary, prompts and every past issue. Money should never be the reason you graduate without a plan. You need time, agency and determination. When you want more than the free system, there are 2 ways to work with me. The 28-Day Career Moat Sprint is the live cohort: 4 weeks building your Career Moat with me and other students on the same path. The Architect's Table is the done-for-you 1-on-1: I run the audits, build the plan and set up the systems with you and for you, personalized to your degree, so all you do is execute."}},{"@type":"Question","name":"Will this work at my university, in my country?","acceptedAnswer":{"@type":"Answer","text":"Yes. Every university sells you the same bundle at one price: The 4 Hidden Assets. The 4 Hidden Assets are the 4 separable assets bundled into every degree at a single price: Credential, Knowledge, Status, and Infrastructure. Only the fees, the units and the job market change by country. That is why the method travels. The Unit Navigator doesn't hand you a verdict from a template. It walks you through pricing your own syllabus in ₹, RM or $, and checking it against live job ads in your own city. The inputs are yours, so the decision fits your university. I built it at Monash in Malaysia, and the same logic holds in Mumbai, Bengaluru, New York, California, London, Melbourne or Toronto. Wherever you study, the real question is whether you're running Degree Arbitrage: extracting all 4 Hidden Assets for Asymmetric ROI, and turning them into something the market will pay for. That market includes employers, clients, and a business of your own."}},{"@type":"Question","name":"Do I need to be technical or good with AI?","acceptedAnswer":{"@type":"Answer","text":"No. If you've used ChatGPT or any AI chatbot at a basic level, you're ready. Every free resource comes with the exact prompts and step-by-step templates. In The Architect's Table, my 8-week 1-on-1, I go further: I set up my full toolkit around your degree and walk you through it live. That covers the Degree Arbitrage and Career Moat audits with scorecards, The 3/10/50 Filter, my AI workflows, a second brain, and the mental models I use to make decisions. You learn each one by using it on your own units, with me checking your work."}},{"@type":"Question","name":"I already have high grades (GPA, CGPA or %). Why would I need this?","acceptedAnswer":{"@type":"Answer","text":"Keep the grades. Then ask yourself 3 questions. Is there a straight line from your grades to the job you want: the pay, the work you'd actually do, the company and the city? If there is, how much of the hiring decision do grades decide, in this era and in your country? In the US, only 42% of employers plan to screen graduates by GPA in 2026, down from 73% in 2019 (NACE Job Outlook 2026). And what decides the rest? For most roles, the rest is your major, your internships and proof of what you can do. That rest is what I call your Career Moat. A Career Moat is your un-replicable advantage: The intersection of 3 variables neither AI nor another graduate can copy, Asymmetric Capability, Calibrated Judgment, and Relational Equity. A 4th element, Scalable Architecture, multiplies a moat that already exists but does not create one. In plain words: can you do the rare thing, do you point it at the right thing, do people trust you to do it, and does it work when you're not in the room? A transcript shows none of these 4."}}]}</script>

<script type="text/babel">

  (function () {

    }
    const cid = L.clarityId;
    if (cid && cid !== 'CLARITY_ID_HERE') {
      (function (c, l, a, r, i, t, y) { c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); }; t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i; y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y); })(window, document, 'clarity', 'script', cid);
    }

    const slug = (t) => (t || '').toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').trim().split(/\s+/).slice(0, 3).join('-');
    const sectionOf = (el) => {
      const tagged = el.closest('[data-section]'); if (tagged) return tagged.getAttribute('data-section');
      if (el.closest('[data-sticky-cta]')) return 'sticky';
      if (el.closest('header')) return 'header';
      if (el.closest('footer')) return 'footer';
      const sec = el.closest('section');
      if (!sec) return 'page';
      if (sec.id) return sec.id;
      if (sec.querySelector('h1')) return 'hero';
      const eb = sec.querySelector('[data-eyebrow]'); if (eb && slug(eb.textContent)) return slug(eb.textContent);
      const h = sec.querySelector('h2,h3'); if (h && slug(h.textContent)) return slug(h.textContent);
      return 'section-' + (Array.prototype.indexOf.call(document.querySelectorAll('main section'), sec) + 1);
    };
    window.plLoc = (el) => (window.PL_ROUTE || 'home') + '-' + (el ? sectionOf(el) : 'page');
    const withSrc = (a) => {
      try { const u = new URL(a.getAttribute('href'), location.href); u.searchParams.set('src', window.plLoc(a)); a.setAttribute('href', u.toString()); } catch (e) {}
    };
    const tagTally = () => document.querySelectorAll('#app a[href*="tally.so"]').forEach(withSrc);
    const withUtm = (a) => {
      try { const u = new URL(a.getAttribute('href'), location.href); if (!/substack\.com$/.test(u.host)) return; u.searchParams.set('utm_source', 'pascalleonghx.me'); u.searchParams.set('utm_medium', 'referral'); u.searchParams.set('utm_campaign', 'newsletter'); u.searchParams.set('utm_content', window.plLoc(a)); a.setAttribute('href', u.toString()); } catch (e) {}
    };
    const tagSubstack = () => document.querySelectorAll('a[href*="substack.com"]').forEach(withUtm);
    window.plTagTally = tagTally;
    new MutationObserver(() => { clearTimeout(window.__plTallyT); window.__plTallyT = setTimeout(() => { tagTally(); tagSubstack(); }, 50); }).observe(document.getElementById('app'), { childList: true, subtree: true });

    document.addEventListener('click', (e) => {
      const el = e.target.closest && e.target.closest('a,button'); if (!el) return;
      if (el.closest('[data-no-track]') || el.hasAttribute('aria-expanded')) return;
      const label = ((el.getAttribute('aria-label') || el.textContent || '').trim().replace(/\s+/g, ' ')).slice(0, 80);
      const p = { location: window.plLoc(el), label };
      const href = el.getAttribute('href') || '';
      if (/tally\.so/.test(href)) { withSrc(el); window.plTrack('apply_click', p); return; }
      if (/^Apply\b/.test(label)) { window.plTrack('apply_click', p); return; }
      if (/substack\.com/.test(href)) { withUtm(el); window.plTrack('substack_click', p); return; }
      if (/^https?:/.test(href)) {
        let host = ''; try { host = new URL(href).host; } catch (_) {}
        if (host && host !== location.host) { window.plTrack('outbound_click', { ...p, host }); return; }
      }
      if (el.closest('header') || el.closest('footer')) { window.plTrack('nav_click', p); return; }
      if (el.type === 'submit') return;
      if (el.closest('[data-calc]')) { window.plTrack('calculator_cta_click', p); return; }
      if (el.hasAttribute('data-cta') || el.tagName === 'A') window.plTrack('cta_click', p);
    }, true);
  })();

  const ROUTE_META = {
    home: ['Pascal Leong | Building the Top 1% of Undergrads', 'Free Unit Navigator: price every class hour of your degree and get a take, audit or skip call on every unit before you enroll.'],
    about: ['About Pascal Leong | Strategic Architect', 'Monash graduate in Finance and Digital Marketing. Why Pascal built Degree Arbitrage and the Career Moat, and his record.'],
    table: ["The Architect's Table | 1-on-1 With Pascal Leong", '8 weeks of 1-on-1 work on your own degree, then 90 days of follow-up. Founding round open: 80% off, 3 seats per round.'],
    sprint: ['The 28-Day Career Moat Sprint | Pascal Leong', 'The live cohort: 4 weeks building your Career Moat with Pascal and students on the same path. Join the waitlist.'],
    tools: ['Free Career Tools | Pascal Leong', 'Free calculators and diagnostics for your degree: the AI Displacement Clock and the Career Moat Scorecard.'],
    navigator: ['The Unit Navigator (Free) | Pascal Leong', 'The 3-Phase Syllabus Audit in one free Notion page. Price every class hour and decide which units to take, audit or skip.'],
    library: ['The Library: Dictionary, Prompts, Insights | Pascal Leong', 'Every term, prompt and Tuesday issue for getting full value from your degree. Free.'],
    kit: ['The Tuesday Issue | Pascal Leong', 'One short issue every Tuesday: 3 education and AI insights, 2 mental models, 1 execution framework.'],
    hub: ['Pascal Leong | Links', 'Every free tool, the newsletter and the ways to work with Pascal Leong, in one place.'],
  };
  const setMeta = (r) => {
    const m = ROUTE_META[r] || ROUTE_META.home;
    document.title = m[0];
    let d = document.querySelector('meta[name="description"]'); if (!d) { d = document.createElement('meta'); d.name = 'description'; document.head.appendChild(d); } d.content = m[1];
    const c = document.querySelector('link[rel="canonical"]'); if (c) c.href = 'https://pascalleonghx.me/' + (r === 'home' ? '' : '#/' + r);
  };
  const ROUTES = ['home', 'about', 'table', 'sprint', 'tools', 'navigator', 'library', 'kit', 'hub'];
  const ROUTE_THEME = { home: 'dark', about: 'dark', table: 'dark', sprint: 'dark', tools: 'dark', navigator: 'dark', hub: 'dark', library: 'light', kit: 'light' };
  const THEME_KEY = 'pl-theme', SCROLL_KEY = 'pl-scroll';
  const readHash = () => { const m = /^#\/([a-z]+)/.exec(location.hash || ''); return m ? (ROUTES.includes(m[1]) ? m[1] : 'home') : null; };
  const readSaved = () => { try { const v = localStorage.getItem(THEME_KEY); return v === 'light' || v === 'dark' ? v : null; } catch (e) { return null; } };
  const routeTheme = (r) => ROUTE_THEME[r] || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const scrollPos = (() => { try { return JSON.parse(sessionStorage.getItem(SCROLL_KEY) || '{}') || {}; } catch (e) { return {}; } })();
  const saveScroll = () => { try { sessionStorage.setItem(SCROLL_KEY, JSON.stringify(scrollPos)); } catch (e) {} };
  try { history.scrollRestoration = 'manual'; } catch (e) {}
  const instant = (y) => window.scrollTo({ top: y, left: 0, behavior: 'instant' });

  const App = () => {
    const [route, setRoute] = React.useState(() => readHash() || 'home');
    const [tool, setTool] = React.useState(null);
    const [saved, setSaved] = React.useState(readSaved);
    const [libSpace, setLibSpace] = React.useState('glossary');
    const routeRef = React.useRef(route);
    const pending = React.useRef(scrollPos[route] || 0);
    const restoring = React.useRef(false);
    const go = (r) => {
      scrollPos[routeRef.current] = window.scrollY; saveScroll();
      pending.current = 0;
      try { history.pushState({ route: r }, '', '#/' + r); } catch (e) {}
      if (r === routeRef.current) { instant(0); return; }
      setRoute(r);
    };
    const openTool = (id) => { setTool(id); go('tools'); };
    const navTo = (r) => { if (r === 'tools') setTool(null); if (r === 'library') setLibSpace('glossary'); go(r); };
    window.PL_NAV = navTo;
    window.PL_ROUTE = route;
    React.useEffect(() => {
      try { if (location.hash !== '#/' + routeRef.current) history.replaceState({ route: routeRef.current }, '', '#/' + routeRef.current); } catch (e) {}
      const onPop = () => {
        const r = readHash(); if (!r) return;
        scrollPos[routeRef.current] = window.scrollY; saveScroll();
        pending.current = scrollPos[r] || 0;
        if (r === routeRef.current) { instant(pending.current); return; }
        setRoute(r);
      };
      let t;
      const onScroll = () => { if (restoring.current) return; scrollPos[routeRef.current] = window.scrollY; clearTimeout(t); t = setTimeout(saveScroll, 200); };
      window.addEventListener('popstate', onPop);
      window.addEventListener('scroll', onScroll, { passive: true });
      return () => { window.removeEventListener('popstate', onPop); window.removeEventListener('scroll', onScroll); };
    }, []);
    React.useEffect(() => {
      routeRef.current = route;
      setMeta(route);
      window.PL_PV = (window.PL_PV || 0) + 1;
      const target = pending.current; let tries = 0, raf;
      restoring.current = true;
      const step = () => {
        instant(target);
        if ((Math.abs(window.scrollY - target) > 2 || tries < 3) && tries++ < 90) raf = requestAnimationFrame(step);
        else { restoring.current = false; scrollPos[route] = window.scrollY; }
      };
      step();
      return () => { cancelAnimationFrame(raf); restoring.current = false; };
    }, [route]);
    const effectiveTheme = saved || routeTheme(route);
    const toggleTheme = (to) => {
      try { localStorage.setItem(THEME_KEY, to); } catch (e) {}
      window.plTrack('theme_toggle', { to, location: route + '-header', label: to === 'light' ? 'Switch to light mode' : 'Switch to dark mode' });
      pending.current = window.scrollY;
      setSaved(to);
    };
    React.useEffect(() => { document.documentElement.setAttribute('data-theme', effectiveTheme); }, [effectiveTheme]);
    React.useEffect(() => { if (saved) { const y = pending.current; requestAnimationFrame(() => instant(y)); } }, [saved]);
    return (
      <LightboxProvider>
        <PLHeader active={route} onNav={navTo} theme={effectiveTheme} onToggleTheme={toggleTheme} />
        <main key={route + effectiveTheme}>
          {route === 'home' && <Landing onNav={navTo} onTool={openTool} theme={effectiveTheme} />}
          {route === 'about' && <AboutPage onNav={navTo} />}
          {route === 'table' && <TablePage />}
          {route === 'sprint' && <SprintPage />}
          {route === 'tools' && <ToolsPage tool={tool} onOpen={openTool} onBack={() => setTool(null)} onNav={navTo} />}
          {route === 'navigator' && <NavigatorClaim />}
          {route === 'hub' && <PLHub theme={effectiveTheme} onNav={navTo} onSpace={(s) => { setLibSpace(s); go('library'); }} />}

          {route === 'kit' && <KitLanding onNav={navTo} />}

        {(route === 'library' || route === 'hub') && <SubscribeBand />}
        <PLFooter onNav={navTo} />
        {route === 'home' && <StickyCTA onCTA={() => navTo('navigator')} route={route} />}
      </LightboxProvider>
    );
  };

  ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
